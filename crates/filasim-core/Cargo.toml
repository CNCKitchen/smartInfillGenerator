[package]
name = "filasim-core"
version.workspace = true
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
# NB: the truck-based `step` feature was DELETED 2026-07-24 — STEP tessellates
# in the JS meshStep worker and enters the engine pre-meshed (DESIGN §18).

[dependencies]
rayon = { version = "1.10", optional = true }
miniz_oxide = "0.8"
quick-xml = "0.37"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "regbench"
path = "src/bin/regbench.rs"
