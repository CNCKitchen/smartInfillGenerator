#
# Enforces the dependency license policy from CONTRIBUTING.md §2 on every PR
# and push: the dual-licensing model (AGPL + commercial exceptions) requires
# that no third-party copyleft code ever lands in the core.
#  - Rust: cargo-deny against the allowlist in deny.toml (all features, so the
#    optional step/parallel trees used by the wasm production build are covered)
#  - npm: license-checker against the same allowlist (full tree, dev included;
#    CC-BY-4.0 is data-only — caniuse-lite; BlueOak-1.0.0 is OSI-approved
#    permissive — tar/chownr et al. inside the wasm-pack dev tooling; the
#    private root package is excluded because license-checker reports
#    `private: true` as UNLICENSED)
#
# meshstep is AGPL-3.0-only but is OUR OWN package (same copyright holder, same
# CLA, dual-licensed on the same terms), so it does not break the commercial
# exception — CONTRIBUTING.md §2 bans AGPL code *we don't own*. It is excluded
# by exact version on purpose: a meshstep bump must fail here once and be
# re-confirmed as first-party before the exclusion is updated.
name: License check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  rust-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo deny check licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  npm-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: npm license allowlist
        run: >-
          npx --yes license-checker --excludePrivatePackages
          --excludePackages "meshstep@0.1.1"
          --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;Zlib;CC0-1.0;MPL-2.0;Unicode-3.0;Unlicense;CC-BY-4.0;BlueOak-1.0.0"
          --summary
        working-directory: web
