[workspace]
resolver = "2"
members = ["crates/filasim-core", "crates/filasim-wasm"]

# Single source of truth for the release version (crates inherit it via
# `version.workspace = true`). Keep web/package.json in step when bumping,
# then tag the release commit: `git tag v<version>`.
[workspace.package]
version = "0.1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 2
